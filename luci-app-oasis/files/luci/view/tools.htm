<%+header%>
<% local translate_js = require("luci.oasis.i18n").translate_js %>

<link rel="stylesheet" type="text/css" href="<%= resource %>/oasis/css/tools.css?v=3.2.6-r38">

<div id="tools-toast" role="status" aria-live="polite" class="toast" aria-atomic="true"></div>
<h2><%:Local Tools%></h2>
<div class="tools-head-block" id="tools-head" style="display:none;">
  <button type="button" id="tools-refresh" class="load-button fullwidth"><%:Refresh%></button>
</div>
<div id="oasis-tool-container"></div>

<!-- Error dialog -->
<div id="tools-error-modal" class="tools-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="tools-card">
    <p id="tools-error-message"><%:An error occurred.%></p>
    <div class="form-actions" style="justify-content:center;">
      <button type="button" id="tools-error-ok" class="delete-button"><%:OK%></button>
    </div>
  </div>
  
</div>

<div id="tools-confirm-modal" class="tools-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="tools-card tools-confirm-card">
    <p id="tools-confirm-title"><%:AI Tool Manifest Confirmation%></p>
    <div id="tools-confirm-message" class="tools-confirm-message">
      <%:The following AI tool manifests are not yet applied. Applying them will register their tools in Oasis.%>
    </div>
    <div id="tools-confirm-list" class="tools-confirm-list"></div>
    <div class="form-actions" style="justify-content:center;">
      <button type="button" id="tools-confirm-cancel" class="delete-button"><%:Cancel%></button>
      <button type="button" id="tools-confirm-apply" class="load-button"><%:Apply%></button>
    </div>
  </div>
</div>

<!--
<h2>Remote MCP Server</h2>
<div id="oasis-mcp-containe"></div>
-->

<script>
window.OasisToolsConfig = {
    csrfToken: '<%=token%>',
    urls: {
        enableTool: '<%=build_url("admin", "network", "oasis", "enable-tool")%>',
        disableTool: '<%=build_url("admin", "network", "oasis", "disable-tool")%>',
        refreshTools: '<%=build_url("admin", "network", "oasis", "refresh-tools")%>',
        loadTools: '<%=build_url("admin", "network", "oasis", "local-tool-info")%>',
        loadManifest: '<%=build_url("admin", "network", "oasis", "tool-manifest")%>'
    }
};
</script>
<script>
window.OasisToolsStrings = {
    manualSelectionNotice: <%= translate_js("These settings apply when Agent mode is OFF. They do not affect tool selection while Agent mode is ON.") %>,
    functionCallingRequired: <%= translate_js("Enable Function Calling for the selected AI service in General Setting to enable tools.") %>,
    normalModeUse: <%= translate_js("Use in Normal mode") %>,
    running: <%= translate_js("Running...") %>,
    refreshFailed: <%= translate_js("Failed to refresh services") %>,
    refreshLabel: <%= translate_js("Refresh") %>,
    errorDefault: <%= translate_js("An error occurred.") %>,
    unknownTool: <%= translate_js("Unknown") %>,
    enabled: <%= translate_js("Enabled") %>,
    disabled: <%= translate_js("Disabled") %>,
    conflict: <%= translate_js("conflict") %>,
    noDescription: <%= translate_js("No description.") %>,
    disableButton: <%= translate_js("Disable") %>,
    enableButton: <%= translate_js("Enable") %>,
    conflictTitle: <%= translate_js("Conflict: cannot change state") %>,
    missingName: <%= translate_js("Missing tool name") %>,
    loading: <%= translate_js("Loading...") %>,
    updateFailed: <%= translate_js("Failed to update tool state") %>,
    manifestButton: <%= translate_js("Manifest") %>,
    hideManifestButton: <%= translate_js("Hide Manifest") %>,
    loadingManifest: <%= translate_js("Loading manifest...") %>,
    manifestNotFound: <%= translate_js("Manifest not found.") %>,
    manifestLoadFailed: <%= translate_js("Failed to load manifest.") %>,
    manifestSourceType: <%= translate_js("Source Type") %>,
    manifestSourcePath: <%= translate_js("Source Path") %>,
    installExtensionHint: <%= translate_js("Please install the extension module 'oasis-mod-tool' to enable local tools.") %>,
    unknownServer: <%= translate_js("Unknown Server") %>,
    confirmRequiredTitle: <%= translate_js("AI Tool Manifest Confirmation") %>,
    confirmRequiredMessage: <%= translate_js("The following AI tool manifests are not yet applied. Applying them will register their tools in Oasis.") %>,
    confirmApplyButton: <%= translate_js("Apply") %>,
    confirmCancelButton: <%= translate_js("Cancel") %>,
    confirmPathLabel: <%= translate_js("Manifest Path") %>,
    confirmSourceTypeLabel: <%= translate_js("Source Type") %>,
    confirmSourcePathLabel: <%= translate_js("Source Path") %>,
    confirmToolCountLabel: <%= translate_js("Tool Count") %>,
    confirmServersLabel: <%= translate_js("Servers") %>,
    confirmToolsLabel: <%= translate_js("Tools") %>,

</script>
<script src="<%= resource %>/oasis/js/tools.js?v=3.2.6-r38"></script>

<%+footer%>
